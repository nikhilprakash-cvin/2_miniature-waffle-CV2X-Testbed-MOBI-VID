name: W3C SSI Compliance Tests

on:
  push:
    branches: [ main, claude/** ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  vc-layer-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install web3 eth-account cryptography pytest coincurve

      - name: Run W3C Verifiable Credentials test suite (28 tests)
        working-directory: 2_w3c-ssi-layer/verifiable-credentials
        run: python3 -m pytest tests/ -v

      - name: Run lifecycle use-case suite (12 use cases, real verification)
        run: python3 cv2x-testbed/scripts/test_use_cases.py

  thesis-compliance-target:
    # The checker executes real checks against the VC layer and DID
    # resolver and exits non-zero if the measured score is below the
    # thesis's 90% target — so this job IS the gate, not a placeholder.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install web3 eth-account cryptography pytest coincurve

      - name: Enforce W3C compliance >= 90% (measured, not asserted)
        run: python3 cv2x-testbed/scripts/w3c_compliance_checker.py

      - name: Upload compliance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w3c-compliance-report
          path: w3c_compliance_report.json
          if-no-files-found: ignore
