name: Smart Contract Tests

on:
  push:
    branches: [ main, claude/** ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  hardhat-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 1_blockchain-identity/package-lock.json

      - name: Install dependencies
        working-directory: 1_blockchain-identity
        run: npm ci

      - name: Compile all 9 standards
        working-directory: 1_blockchain-identity
        run: npx hardhat compile

      - name: Run full contract test suite (147 tests, all 9 standards)
        working-directory: 1_blockchain-identity
        run: npx hardhat test

  mobi-vid-onchain:
    # The MOBI VID Python layer drives a Hardhat node it starts itself,
    # so it needs both the compiled contracts and the Python deps.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 1_blockchain-identity/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node deps + compile
        working-directory: 1_blockchain-identity
        run: |
          npm ci
          npx hardhat compile

      - name: Install Python deps
        run: pip install web3 eth-account cryptography pytest coincurve

      - name: Run MOBI VID on-chain layer tests
        working-directory: 2_w3c-ssi-layer/mobi-vid
        run: python3 -m pytest tests/ -v
