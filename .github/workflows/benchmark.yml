name: Performance Benchmarks

on:
  push:
    branches: [ main, claude/** ]
  schedule:
    # Run benchmarks daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  gas-benchmark:
    # Real receipt.gasUsed across all 9 standards; regenerates the thesis
    # comparison tables (CSV + LaTeX) from the measured JSON.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 1_blockchain-identity/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: 1_blockchain-identity
        run: npm ci

      - name: Run 9-standard gas benchmark
        working-directory: 1_blockchain-identity
        run: npx hardhat run scripts/benchmark_gas.js

      - name: Regenerate thesis tables (CSV + LaTeX)
        working-directory: 4_comparison-framework/performance-metrics
        run: python3 generate_tables.py

      - name: Upload gas benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gas-benchmark
          path: |
            4_comparison-framework/results/gas_benchmark.json
            4_comparison-framework/results/gas_comparison.csv
            4_comparison-framework/results/gas_comparison.tex

  v2v-latency-benchmark:
    # Thrust 3: real cryptographic verification latency in the V2V path.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install web3 eth-account cryptography pytest coincurve

      - name: Measure V2V verification latency (50 vehicles, real crypto)
        run: python3 cv2x-testbed/sumo/sumo_identity_integration.py --simulate --duration 30

      - name: Upload V2V latency results
        uses: actions/upload-artifact@v4
        with:
          name: v2v-latency
          path: cv2x-testbed/sumo/results/v2v_latency.json
