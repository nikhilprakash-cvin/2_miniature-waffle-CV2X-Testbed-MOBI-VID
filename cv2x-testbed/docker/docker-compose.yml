version: '3.8'

services:
  # SUMO Traffic Simulator
  sumo:
    image: eclipse/sumo:latest
    container_name: cv2x-sumo
    volumes:
      - ../scenarios:/scenarios
      - ./sumo-config:/config
    networks:
      - cv2x-network
    command: sumo-gui -c /config/simulation.sumocfg

  # NS-3 Network Simulator with CV2X extensions
  ns3-cv2x:
    build:
      context: ./ns3
      dockerfile: Dockerfile
    container_name: cv2x-ns3
    volumes:
      - ../protocols:/protocols
      - ../scenarios:/scenarios
      - ./ns3-output:/output
    networks:
      - cv2x-network
    environment:
      - SIMULATION_MODE=cv2x
      - LOG_LEVEL=INFO
    depends_on:
      - sumo

  # Standard PKI Certificate Authority
  pki-ca:
    build:
      context: ./pki
      dockerfile: Dockerfile
    container_name: cv2x-pki-ca
    ports:
      - "8080:8080"
    volumes:
      - ../identity/standard:/identity
      - ./pki-data:/data
    networks:
      - cv2x-network
    environment:
      - CA_PRIVATE_KEY=/data/ca-key.pem
      - CA_CERTIFICATE=/data/ca-cert.pem

  # Vehicle Identity Manager
  identity-manager:
    build:
      context: ../identity
      dockerfile: Dockerfile
    container_name: cv2x-identity-mgr
    ports:
      - "3000:3000"
    volumes:
      - ../identity:/app
    networks:
      - cv2x-network
    environment:
      - MODE=standard  # Will change to 'did' for comparison
      - PKI_CA_URL=http://pki-ca:8080
      - BLOCKCHAIN_RPC=http://blockchain:8545
    depends_on:
      - pki-ca

  # Local Blockchain (for DID integration)
  blockchain:
    image: trufflesuite/ganache:latest
    container_name: cv2x-blockchain
    ports:
      - "8545:8545"
    networks:
      - cv2x-network
    command: >
      ganache-cli
      --host 0.0.0.0
      --port 8545
      --deterministic
      --mnemonic "test test test test test test test test test test test junk"
      --networkId 1337
      --gasLimit 12000000

  # Metrics Collection & Monitoring
  metrics-collector:
    build:
      context: ./metrics
      dockerfile: Dockerfile
    container_name: cv2x-metrics
    ports:
      - "9090:9090"  # Prometheus
      - "3001:3001"  # Grafana
    volumes:
      - ./metrics-data:/data
      - ../scenarios:/scenarios
    networks:
      - cv2x-network
    environment:
      - PROMETHEUS_PORT=9090
      - GRAFANA_PORT=3001

  # Web Dashboard
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: cv2x-dashboard
    ports:
      - "8000:8000"
    volumes:
      - ../scenarios:/scenarios
      - ./metrics-data:/metrics
    networks:
      - cv2x-network
    depends_on:
      - metrics-collector
      - identity-manager

networks:
  cv2x-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

volumes:
  sumo-config:
  pki-data:
  metrics-data:
  ns3-output:
